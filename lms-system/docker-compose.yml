version: '3.9'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: lms-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: lms_db
      MYSQL_USER: lms_user
      MYSQL_PASSWORD: lms_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - lms-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Node.js Backend
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: lms-backend
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://lms_user:lms_password@db:3306/lms_db
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_REFRESH_SECRET: your-super-secret-refresh-key-change-in-production
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_REDIRECT_URI: http://localhost/api/auth/discord/callback
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      API_URL: http://localhost/api
      FRONTEND_URL: http://localhost
      PORT: 3000
      LOG_LEVEL: info
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
    ports:
      - "3000:3000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lms-network
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: lms-frontend
    ports:
      - "3001:80"
    environment:
      REACT_APP_API_URL: http://localhost/api
    depends_on:
      - backend
    networks:
      - lms-network
    restart: unless-stopped

  # NGINX Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: lms-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - lms-network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  lms-network:
    driver: bridge
