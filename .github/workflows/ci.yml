name: CI/CD

on:
  push:
    branches: [main, audio-cf]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: cf-chat/package-lock.json

      - name: Install dependencies
        working-directory: cf-chat
        run: npm ci

      - name: Run ESLint
        working-directory: cf-chat
        run: npm run lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: cf-chat/package-lock.json

      - name: Install dependencies
        working-directory: cf-chat
        run: npm ci

      - name: Run TypeScript check
        working-directory: cf-chat
        run: npm run type-check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: cf-chat/package-lock.json

      - name: Install dependencies
        working-directory: cf-chat
        run: npm ci

      - name: Run tests with coverage
        working-directory: cf-chat
        run: npm run test

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          directory: cf-chat/coverage
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: cf-chat/package-lock.json

      - name: Install dependencies
        working-directory: cf-chat
        run: npm ci

      - name: Build
        working-directory: cf-chat
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: cf-chat/dist

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: cf-chat/package-lock.json

      - name: Install dependencies
        working-directory: cf-chat
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: cf-chat/dist

      - name: Deploy to Cloudflare Workers
        id: deploy
        working-directory: cf-chat
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --env production
          echo "url=https://cf-chat.${{ secrets.CLOUDFLARE_SUBDOMAIN }}.workers.dev" >> $GITHUB_OUTPUT
